<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akronim&family=Black+Ops+One&family=Carter+One&family=Faster+One&family=Press+Start+2P&family=Shrikhand&display=swap" rel="stylesheet">
    <title>Calculadora funcional</title>
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="imagem_calculadora">
            <img src="./imagens/calculadora (1).png" alt="calculadora da xuxa">
        </section>
    </main>
    
    <div class="botoes_numeros">
        <div><button type="button">7</button></div>
        <div><button type="button">8</button></div>
        <div><button type="button">9</button></div>
        <div><button type="button">4</button></div>
        <div><button type="button">5</button></div>
        <div><button type="button">6</button></div>
        <div><button type="button">1</button></div>
        <div><button type="button">2</button></div>
        <div><button type="button">3</button></div>
        <div><button type="button">0</button></div>
        <div><button type="button">A</button></div>
        <div><button type="button">,</button></div>
    </div>
     
    <div class="botoes_operadores">
        <button type="button" id="" class="btn">G</button>
        <button type="button" id="desliga" class="btn">⏻</button>
        <button type="button" id="dividir" class="btn">&divide;</button>
        <button type="button" id="raiz" class="btn">&radic;</button>
        <button type="button" id="multiplicar" class="btn">x</button>
        <button type="button" id="porcento" class="btn">%</button>
        <button type="button" id="subtrair" class="btn">-</button>
        <button type="button" id="ce" class="btn">⬅</button>
    </div>
       
    <div><button type="button" id="liga" class="btn-sozinho">ON/AC</button></div>

    <div class="btn-outros">
        <button type="button" id="mmais" class="btn">M+</button>
        <button type="button" id="mmenos" class="btn">M-</button>
        <button type="button" id="mrc" class="btn">MRC</button>
    </div>

    <div class="btn_mais_igual">
        <button type="button" id="somar" class="btn_">+</button>
        <button type="button" id="igual" class="btn_">=</button>
    </div>

    <div>
        <input class="tela" type="text" value="" readonly>
    </div>
    
    <script src="script.js" defer></script>

</body>
</html>
